# =============================================================================
# duckai-sidebar Configuration
# Place this file at ~/.config/duckai-sidebar/config.ini
# =============================================================================

[general]
# URL to embed
url = https://duck.ai

# Width of the sidebar in pixels (default: 420)
width = 420

# Screen edge to anchor the sidebar to: "left" or "right" (default: right)
edge = right

# Layer-shell layer: "top", "overlay", "bottom", or "background" (default: top)
layer = top

# Target monitor: "active" (tracks focused monitor) or connector name (e.g. eDP-1, DP-1)
monitor = active

# Request exclusive zone so tiled windows dynamically leave room for the sidebar
exclusive_zone = true

# Keyboard interactivity mode: "on-demand" (recommended), "exclusive", or "none"
keyboard_mode = on-demand

# Show a minimal top control strip (+ New, Reload, Open in browser, Close)
show_header = false

# Pressing Escape closes/hides the sidebar
close_on_escape = true

[appearance]
# Border width in pixels (default: 2)
border_width = 2

# Border color: CSS color, hex (e.g. #33ccff), or rgba.
# Leave empty to automatically use desktop accent color (@theme_selected_bg_color)
border_color = 

# Border placement: "inner" (only edge bordering tiled windows) or "all" (all sides)
border_mode = inner

[margins]
# Distance in pixels from screen edges
top = 0
bottom = 0
left = 0
right = 0

[webview]
# Enable smooth scrolling
enable_smooth_scrolling = true

# Enable WebGL acceleration
enable_webgl = true

# Allow clipboard access for copying chat answers and code snippets
enable_clipboard = true

# Custom User-Agent string (leave empty for default)
user_agent = 
