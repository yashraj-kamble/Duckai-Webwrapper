# =============================================================================
# Hyprland Integration for duckai-sidebar
# Source this file from your ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/duckai-sidebar.conf
# =============================================================================

# Define modifier key if not already defined (SUPER = Mod4)
$mainMod = SUPER

# ── Primary Toggle Shortcut ──────────────────────────────────────────────────
# Press SUPER+D to toggle the Duck.ai sidebar.
# If duckai-sidebar is not running, it starts it and displays the panel.
# If already running, it toggles visibility without restarting or losing session.
bind = $mainMod, D, exec, duckai-sidebar --toggle

# ── Optional: Fast Preload on Startup ────────────────────────────────────────
# Uncomment this line to start duckai-sidebar silently at login in the background.
# This preloads Duck.ai so your first SUPER+D press is instant.
# exec-once = duckai-sidebar --hidden

# ── Wayland Layer Shell Rules (Native compositor integration) ────────────────
# Because duckai-sidebar uses the Wayland layer-shell protocol, it natively
# claims an exclusive zone on the screen edge. You do NOT need floating rules,
# window rules, or special workspace hacks.

# Namespace: duckai-sidebar
# Optional animations & effects (uncomment to enable):
# layerrule = blur, duckai-sidebar
# layerrule = ignorezero, duckai-sidebar
# layerrule = animation slide right, duckai-sidebar
